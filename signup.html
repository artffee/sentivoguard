<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create your account — SentivoGuard</title><link rel="stylesheet" href="landing.css"><link rel="stylesheet" href="web.css"></head><body><nav class="nav"><a class="brand" href="/">SentivoGuard</a></nav><main class="account"><h1>Create your account</h1><p>Use the same account across your browsers and devices.</p><form id="auth" data-action="signup"><label>Email<input name="email" type="email" maxlength="254" autocomplete="email" required></label><label>Password<input name="password" type="password" minlength="8" maxlength="200" autocomplete="new-password" required></label><label>Confirm password<input name="password2" type="password" minlength="8" maxlength="200" autocomplete="new-password" required></label><button class="btn btn-primary">Create your account</button></form><p id="notice" role="status"></p><p><a href="/login">Already have an account? Sign in</a></p><p>By creating an account you agree to our <a href="/terms">Terms</a> and <a href="/privacy">Privacy policy</a>.</p></main><script src="web/auth.js"></script></body></html>
