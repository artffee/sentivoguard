<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up · SentivoGuard</title>
  <meta name="description" content="Create a SentivoGuard account. Free tier downloads work immediately, paid plans unlock the full suite." />
  <link rel="stylesheet" href="/landing.css" />
  <style>
    .auth-shell {
      max-width: 460px;
      margin: 0 auto;
      padding: 80px 32px 96px;
      position: relative; z-index: 1;
    }
    .auth-card {
      background: var(--bg-2);
      border: 1px solid var(--bg-4);
      border-radius: var(--radius);
      padding: 36px 32px;
    }
    .auth-card h1 {
      font-size: 24px;
      letter-spacing: -0.02em;
      margin: 6px 0 8px;
    }
    .auth-card p.lede {
      color: var(--fg-1);
      font-size: 14px;
      margin: 0 0 22px;
    }
    label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--fg-2);
      margin-bottom: 6px;
    }
    .input {
      width: 100%;
      background: var(--bg-3);
      border: 1px solid var(--bg-4);
      color: var(--fg-0);
      padding: 11px 14px;
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 14px;
      transition: border-color 0.15s;
    }
    .input:focus { outline: none; border-color: var(--accent-2); }
    .form-row + .form-row { margin-top: 14px; }

    .alert {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
    }
    .alert.err { background: rgba(230,57,70,0.10); border: 1px solid rgba(230,57,70,0.3); color: var(--danger); }
    .alert.ok  { background: rgba(82,183,136,0.10); border: 1px solid rgba(82,183,136,0.3); color: var(--ok); }
    .alert.hidden { display: none; }

    .auth-foot {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--bg-4);
      font-size: 12.5px;
      color: var(--fg-2);
      text-align: center;
    }
    .auth-foot a { color: var(--accent-3); }

    .note {
      margin-top: 14px;
      font-size: 11.5px;
      color: var(--fg-3);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <nav class="nav">
    <a class="brand" href="/">
      <span class="logo">
        <span class="logo-block"></span><span class="logo-block"></span>
      </span>
      <span class="brand-name">SentivoGuard</span>
    </a>
    <div class="nav-links">
      <a href="/#tools">Tools</a>
      <a href="/#pricing">Pricing</a>
      <a href="/blog">Blog</a>
      <a href="/login">Sign in</a>
    </div>
    <a class="btn btn-primary" href="/members">Members</a>
  </nav>

  <main class="auth-shell">
    <div class="auth-card">
      <span class="eyebrow">Create your account</span>
      <h1>Sign up for SentivoGuard</h1>
      <p class="lede">Free account includes Disk Scan, Quarantine, basic SentivoClean. Upgrade any time.</p>

      <form id="signup-form" novalidate>
        <div class="form-row">
          <label for="email">Email</label>
          <input id="email" type="email" class="input"
                 placeholder="you@example.com" autocomplete="email" required />
        </div>

        <div class="form-row">
          <label for="password">Password</label>
          <input id="password" type="password" class="input"
                 placeholder="8+ characters" autocomplete="new-password"
                 minlength="8" required />
        </div>

        <div class="form-row">
          <label for="password2">Confirm password</label>
          <input id="password2" type="password" class="input"
                 autocomplete="new-password" minlength="8" required />
        </div>

        <div id="signup-alert" class="alert err hidden"></div>

        <button type="submit" class="btn btn-primary"
                style="width: 100%; margin-top: 18px; justify-content: center;">
          Create account
        </button>
      </form>

      <div class="auth-foot">
        Already have an account? <a href="/login">Sign in</a>
      </div>

      <p class="note" id="device-note">
        Loading…
      </p>

      <p class="note" style="text-align: center; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--bg-4);">
        By creating an account you agree to our
        <a href="/terms" style="color: var(--accent-3);">Terms</a> and
        <a href="/privacy" style="color: var(--accent-3);">Privacy Policy</a>.
      </p>
    </div>
  </main>

  <script>
    // Already signed in? Skip to /members. Also read crossDeviceLogin
    // capability and adjust the messaging.
    (async () => {
      let r = {};
      try { r = await fetch("/api/auth/me").then(r => r.json()); } catch {}
      if (r.ok && r.authenticated) { location.href = "/members"; return; }

      const note = document.getElementById("device-note");
      if (r.crossDeviceLogin) {
        note.innerHTML =
          "<b>Cross-device login enabled.</b> Sign in from any browser using your email + password.";
      } else {
        note.textContent =
          "Per-device accounts: your account lives in this browser's secure cookie. " +
          "Cross-device login activates once a Redis store is connected on the server.";
      }
    })();

    document.getElementById("signup-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email     = document.getElementById("email").value.trim();
      const password  = document.getElementById("password").value;
      const password2 = document.getElementById("password2").value;
      const alertEl   = document.getElementById("signup-alert");
      alertEl.classList.add("hidden");

      if (password !== password2) {
        return showErr("Passwords don't match.");
      }

      const resp = await fetch("/api/auth/signup", {
        method:  "POST",
        headers: { "content-type": "application/json" },
        body:    JSON.stringify({ email, password })
      }).then(r => r.json()).catch(() => ({ ok: false, error: "network" }));

      if (!resp.ok) {
        const msg = ({
          invalid_email:    "That email looks invalid.",
          invalid_password: "Password must be at least 8 characters.",
          network:          "Network error — try again."
        })[resp.error] || ("Signup failed: " + (resp.error || "unknown"));
        return showErr(msg);
      }

      // Success — redirect to members area
      location.href = "/members?welcome=1";

      function showErr(m) {
        alertEl.className = "alert err";
        alertEl.textContent = m;
      }
    });
  </script>
</body>
</html>
