<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · SentivoGuard</title>
  <link rel="stylesheet" href="/landing.css" />
  <style>
    .auth-shell {
      max-width: 460px;
      margin: 0 auto;
      padding: 80px 32px 96px;
      position: relative; z-index: 1;
    }
    .auth-card {
      background: var(--bg-2);
      border: 1px solid var(--bg-4);
      border-radius: var(--radius);
      padding: 36px 32px;
    }
    .auth-card h1 {
      font-size: 24px;
      letter-spacing: -0.02em;
      margin: 6px 0 8px;
    }
    .auth-card p.lede {
      color: var(--fg-1);
      font-size: 14px;
      margin: 0 0 22px;
    }
    label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--fg-2);
      margin-bottom: 6px;
    }
    .input {
      width: 100%;
      background: var(--bg-3);
      border: 1px solid var(--bg-4);
      color: var(--fg-0);
      padding: 11px 14px;
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 14px;
    }
    .input:focus { outline: none; border-color: var(--accent-2); }
    .form-row + .form-row { margin-top: 14px; }

    .alert {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
    }
    .alert.err { background: rgba(230,57,70,0.10); border: 1px solid rgba(230,57,70,0.3); color: var(--danger); }
    .alert.hidden { display: none; }

    .auth-foot {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--bg-4);
      font-size: 12.5px;
      color: var(--fg-2);
      text-align: center;
    }
    .auth-foot a { color: var(--accent-3); }
  </style>
</head>
<body>
  <div class="bg"></div>

  <nav class="nav">
    <a class="brand" href="/">
      <span class="logo">
        <span class="logo-block"></span><span class="logo-block"></span>
      </span>
      <span class="brand-name">SentivoGuard</span>
    </a>
    <div class="nav-links">
      <a href="/#tools">Tools</a>
      <a href="/#pricing">Pricing</a>
      <a href="/blog">Blog</a>
      <a href="/signup">Sign up</a>
    </div>
    <a class="btn btn-primary" href="/members">Members</a>
  </nav>

  <main class="auth-shell">
    <div class="auth-card">
      <span class="eyebrow">Welcome back</span>
      <h1>Sign in to SentivoGuard</h1>
      <p class="lede">Per-device accounts — sign in with the email + password you used on this browser.</p>

      <form id="login-form" novalidate>
        <div class="form-row">
          <label for="email">Email</label>
          <input id="email" type="email" class="input"
                 placeholder="you@example.com" autocomplete="email" required />
        </div>

        <div class="form-row">
          <label for="password">Password</label>
          <input id="password" type="password" class="input"
                 autocomplete="current-password" required />
        </div>

        <div id="login-alert" class="alert err hidden"></div>

        <button type="submit" class="btn btn-primary"
                style="width: 100%; margin-top: 18px; justify-content: center;">
          Sign in
        </button>
      </form>

      <div class="auth-foot">
        Don't have an account? <a href="/signup">Sign up</a>
        <br /><span style="margin-top: 8px; display: inline-block; color: var(--fg-3);">
          Or
          <a href="/members" style="color: var(--accent-3);">paste a license key</a>
          to download without an account.
        </span>
      </div>
    </div>
  </main>

  <script>
    // Already signed in? Skip to /members.
    (async () => {
      try {
        const r = await fetch("/api/auth/me").then(r => r.json());
        if (r.ok && r.authenticated) location.href = "/members";
      } catch {}
    })();

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email    = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const alertEl  = document.getElementById("login-alert");
      alertEl.classList.add("hidden");

      const resp = await fetch("/api/auth/login", {
        method:  "POST",
        headers: { "content-type": "application/json" },
        body:    JSON.stringify({ email, password })
      }).then(r => r.json()).catch(() => ({ ok: false, error: "network" }));

      if (!resp.ok) {
        const msg = ({
          missing_credentials:           "Email and password required.",
          no_account_on_this_device:
            "No account on this browser yet. Per-device accounts — please sign up here first.",
          wrong_password:                "Wrong password.",
          wrong_email_for_this_device:
            "A different account exists on this device. Sign out first to register a new one.",
          invalid_session:               "Session expired — sign up again.",
          network:                       "Network error — try again."
        })[resp.error] || ("Sign-in failed: " + (resp.error || "unknown"));
        alertEl.className = "alert err";
        alertEl.textContent = msg;
        return;
      }

      location.href = "/members";
    });
  </script>
</body>
</html>
